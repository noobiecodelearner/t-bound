# [vision_cifar10_grid). — N × D × lr grid sweep for CIFAR-10

domain: vision
dataset: cifar10
architecture: cnn
data_path: data/raw/cifar10/cifar-10-batches-py
num_classes: 10

sweep_type: n_d_lr_grid

# Training budget — fixed steps, not epochs
# epochs = ceil(num_steps / steps_per_epoch) per run
num_steps: 10000

# 6 model sizes — width_multiplier applied to [64, 128, 256]
model_scales:
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  - 1.5
  - 2.0

# 6 dataset sizes (fraction of 45K training pool after val split)
dataset_sizes:
  - 0.10
  - 0.20
  - 0.35
  - 0.50
  - 0.75
  - 1.00

# 6 learning rates (log-spaced)
lr_sweep_values:
  - 0.01
  - 0.003
  - 0.001
  - 0.0003
  - 0.0001
  - 0.00003

# Fixed during this sweep
fixed_batch: 128

# Training settings
optimizer: adam
weight_decay: 0.0001
gpu_wattage: 250
