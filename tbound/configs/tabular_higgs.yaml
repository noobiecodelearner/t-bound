domain: tabular
dataset: higgs
data_path: data/raw/higgs
num_classes: 2
input_dim: 28

dataset_fractions:
  - 0.25
  - 0.5
  - 1.0

sweep_type: model_size

model_scales:
  hidden_sizes:
    - 32
    - 64
    - 128
    - 256
    - 512
    - 1024

training:
  epochs: 15
  batch_size: 512
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001

energy:
  gpu_wattage: 250
