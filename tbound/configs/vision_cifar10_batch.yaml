# [vision_cifar10_batch). — batch sweep for CIFAR-10
# Fill in fixed_n_star and fixed_lr_star after n_d_lr_grid completes

domain: vision
dataset: cifar10
architecture: cnn
data_path: data/raw/cifar10/cifar-10-batches-py
num_classes: 10

sweep_type: batch_grid

num_steps: 10000

# Fill these in after running vision_cifar10_grid.yaml
# and fitting the scaling law to find N* and lr*(N*)
fixed_n_star: null
fixed_lr_star: null

model_scales:
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  - 1.5
  - 2.0

batch_sweep_values:
  - 32
  - 64
  - 128
  - 256
  - 512
  - 1024

dataset_sizes:
  - 0.25
  - 0.50
  - 1.00

optimizer: adam
weight_decay: 0.0001
gpu_wattage: 250
